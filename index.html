    <!-- Only the two families the app chrome uses. Everything a card or the
         Studio can pick (30+ families) loads on demand -- see src/lib/fontLoader.js.
         media=print + onload makes the stylesheet non-render-blocking. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" /></noscript>
    <!-- First-paint theme: mirrors src/lib/theme.js resolveTheme(). In <head>
         so the page never paints in the wrong theme before the bundle runs. -->
    <script>try{var t=localStorage.getItem('cardora-theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t==='light')document.documentElement.dataset.theme='light';var m=document.createElement('meta');m.name='theme-color';m.content=t==='light'?'#f4f8fb':'#0b0f12';document.head.appendChild(m);}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
